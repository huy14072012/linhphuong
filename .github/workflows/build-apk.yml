name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and Build APK
        run: |
          find . -name "gradlew" -exec chmod +x {} \;
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Gradlew not found, checking for zip..."
            if [ -f "cinesub-ai.zip" ]; then
              unzip -o cinesub-ai.zip
              find . -name "gradlew" -exec chmod +x {} \;
              GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            fi
          fi
          
          if [ -n "$GRADLEW_PATH" ]; then
            DIR_PATH=$(dirname "$GRADLEW_PATH")
            cd "$DIR_PATH"
            ./gradlew assembleDebug
          else
            echo "Error: gradlew not found anywhere."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchaCut-debug-apk
          path: "**/*.apk"
