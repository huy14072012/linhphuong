name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack Zip and Build APK
        run: |
          if ls *.zip >/dev/null 2>&1; then
            unzip -o '*.zip' -d extracted_source
          fi
          PROJECT_DIR=$(dirname "$(find . -maxdepth 4 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Khong tim thay thu muc du an Gradle!"
            exit 1
          fi
          cd "$PROJECT_DIR"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --no-daemon
          fi
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatchaCut-debug-apk
          path: "**/*.apk"
